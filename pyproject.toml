[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-tray"
dynamic = ["version"]
description = "A general-purpose observation tool combining Sieve Lens, Sieve Scope, and Sieve Referee"
readme = "README.md"
authors = [{ name = "Kai IWASAKI" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["sieve-lens>=0.10.0", "sieve-scope>=1.3.0", "sieve-referee>=1.0.0"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
sieve-tray = "sieve_tray:main"
sieve-tray-gui = "sieve_tray_gui:main"

[tool.setuptools]
py-modules = ["sieve_tray", "sieve_tray_gui", "sieve_tray_storage", "sieve_tray_i18n"]

[tool.setuptools.dynamic]
version = { attr = "sieve_tray.__version__" }