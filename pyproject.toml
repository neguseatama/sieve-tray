[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-tray"
dynamic = ["version"]
description = "A general-purpose observation tool combining Sieve Lens, Sieve Scope, and Sieve Referee"
readme = "README.md"
authors = [{ name = "Kai IWASAKI" }]
license = { text = "MIT" }
requires-python = ">=3.10"
# v0.8.0: bumped sieve-referee from >=1.0.0 to >=1.3.0 - the quantifier
# audit lane and certainty-marker annotation are 1.3.0 features.
# v1.2.0: bumped sieve-lens from >=0.10.0 to >=0.20.2 (design doc §3.3) -
# 0.20.2 is the first release carrying all 13 refusal codes Tray's
# classification (KNOWN_REFUSAL_CODES) maps to detail labels, including
# unsupported_namespace.
# v2.0.0 (M1 Gate): bumped sieve-lens from >=0.20.2 to >=0.22.0 - Gate
# consumes visible_text (and the charset diagnostics shape added in
# 0.22.0); 0.22.0 is published and its UTF-8 results are byte-identical
# to 0.21.2, so the scan molds are unaffected.
dependencies = ["sieve-lens>=0.22.0", "sieve-scope>=1.3.0", "sieve-referee>=1.3.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Text Processing :: Filters",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5", "Pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/neguseatama/sieve-tray"
Repository = "https://github.com/neguseatama/sieve-tray.git"
"Bug Tracker" = "https://github.com/neguseatama/sieve-tray/issues"

[project.scripts]
sieve-tray = "sieve_tray:main"
sieve-tray-gui = "sieve_tray_gui:main"

[tool.setuptools]
# 2.1.0 (request §3.10, CH-T14): the two sample packs travel in the
# wheel so the `gate --self-check` / `cohort --self-check` runs work
# from an installed wheel without the repo tree.  samples is one plain
# package (no __init__.py inside gate/ or cohort/ - the pack contents
# must stay byte-identical to the generator's output), the files ride
# as package-data.
packages = ["sieve_crowd", "sieve_order", "samples"]
py-modules = ["sieve_tray", "sieve_tray_gui", "sieve_tray_storage", "sieve_tray_i18n", "sieve_redact"]
# v1.1.0 (design doc §3.8-F): the vendored sieve_crowd may carry data files
# (.json etc.) in a future vendor update (v1.2.0). Declaring the patterns
# now keeps such files from silently dropping out of wheels/sdists; with
# no data files present the patterns match nothing and nothing changes.

# v0.8.0: the default modifier vocab is sourced from sieve_referee's
# embedded DEFAULT_MODIFIER_VOCAB at runtime (no separate data file
# shipped). The bundled epistemic_modifiers_ja_v1.txt stays in the
# repo as a reference file for users who want to copy/edit it.

[tool.setuptools.package-data]
sieve_crowd = ["*.json", "*.txt", "*.csv"]
"samples" = ["gate/*", "cohort/*"]

[tool.setuptools.dynamic]
version = { attr = "sieve_tray.__version__" }