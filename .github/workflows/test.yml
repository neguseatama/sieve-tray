name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install sieve-tray and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest

      - name: Verify vendored sieve_redact matches the published release
        run: |
          curl -fsSL https://raw.githubusercontent.com/neguseatama/sieve-redact/v0.5.0/sieve_redact.py -o /tmp/upstream_redact.py
          PIN=$(python3 -c "import re, pathlib; print(re.search(r'PINNED_SHA256 = \"([0-9a-f]+)\"', pathlib.Path('tests/test_redact_vendor_sync.py').read_text()).group(1))")
          echo "pinned sha256: $PIN"
          echo "$PIN  /tmp/upstream_redact.py" | sha256sum -c -
          echo "$PIN  sieve_redact.py" | sha256sum -c -
      - name: Run tests
        run: pytest -v
