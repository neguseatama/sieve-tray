name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-24.04, windows-latest, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt system libraries for offscreen tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1

      - name: Install sieve-tray and test dependencies
        run: |
          python -m pip install --upgrade pip
          # CH-T14's wheel smoke builds with --no-build-isolation: the build
          # backend must exist here (PR #1 CI red: no module named setuptools)
          pip install setuptools
          pip install ".[gui]"
          pip install pytest pypdf tinycss2 cssselect2

      - name: Verify vendored sieve_redact matches the published release
        shell: python
        run: |
          # 2.1.1 (the three-OS Test matrix): the check went
          # cross-platform - sha256sum / python3 / curl are not
          # portable across the three runners, the python shell is.
          # 2.6.0 (the engine updates): the reference moves to the
          # published PyPI 0.12.0 sdist - the 0.12.x releases have no
          # GitHub tag, so the raw-URL fetch has nothing to point at.
          # The version JSON names the sdist and its digest; the sdist
          # is fetched, digest-checked, its sieve_redact.py extracted,
          # and both sides must hash to the PINNED_SHA256 in
          # tests/test_redact_vendor_sync.py.
          import hashlib, io, json, pathlib, re, sys, tarfile
          import urllib.request
          meta = json.load(urllib.request.urlopen(
              "https://pypi.org/pypi/sieve-redact/0.12.0/json"))
          sdist = None
          for f in meta["urls"]:
              if f["filename"].endswith(".tar.gz"):
                  sdist = f
          assert sdist is not None, "no sdist on the 0.12.0 release"
          blob = urllib.request.urlopen(sdist["url"]).read()
          got = hashlib.sha256(blob).hexdigest()
          assert got == sdist["digests"]["sha256"], (
              "sdist digest mismatch: %s != %s"
              % (got, sdist["digests"]["sha256"]))
          with tarfile.open(fileobj=io.BytesIO(blob), mode="r:gz") as tf:
              member = [m for m in tf.getmembers()
                        if m.name.endswith("sieve_redact.py")][0]
              upstream = tf.extractfile(member).read()
          pin = re.search(r'PINNED_SHA256 = "([0-9a-f]+)"',
                          pathlib.Path("tests/test_redact_vendor_sync.py")
                          .read_text(encoding="utf-8")).group(1)
          print("pinned sha256:", pin)
          # the windows runner image ships core.autocrlf, so its git may
          # check this text file out with CRLF while the pin certifies
          # the canonical LF blob - normalize before hashing; genuine
          # drift still fails and the LF legs are the live control
          for name, blob2 in (("upstream", upstream),
                              ("vendored",
                               pathlib.Path("sieve_redact.py").read_bytes()
                               .replace(b"\r\n", b"\n"))):
              got2 = hashlib.sha256(blob2).hexdigest()
              assert got2 == pin, "%s: %s != %s" % (name, got2, pin)
          print("vendor sync verified on", sys.platform)
      - name: Run tests
        run: python -m pytest -v

      - name: Public-text watch
        run: python tools/check_public_text.py

  hook-integration:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the tree and pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" pypdf tinycss2 cssselect2 pre-commit
      - name: Run the hook against this tree
        run: pre-commit try-repo . sieve-check --files samples/gate/plain.txt

  action-integration:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the action's runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf tinycss2 cssselect2
      - name: Run the local action
        uses: ./
        with:
          paths: samples/gate
          tray-version: -e .
