name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: SieveTray-windows.zip
          - os: macos-15
            asset_name: SieveTray-macos-arm64.zip
          - os: macos-15-intel
            asset_name: SieveTray-macos-intel.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sieve-tray, GUI deps, and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]"
          pip install pyinstaller

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name SieveTray --collect-all PySide6
          --icon assets/icon.ico
          --add-data "assets/icon.png;assets"
          sieve_tray_gui.py

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --windowed
          --name SieveTray --icon=assets/icon.icns --collect-all PySide6
          --add-data "assets/icon.png:assets"
          sieve_tray_gui.py

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/SieveTray.exe -DestinationPath dist/${{ matrix.asset_name }}
        shell: pwsh

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent SieveTray.app ${{ matrix.asset_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}

  release-extras:
    # v1.4.0: the SHA-256 list of the three assets and the artifact
    # attestation. No code signing / notarization by decision - the
    # verification means are the hash list and the build provenance.
    # Measured 2026-11-06: actions/attest@v4 is the official action for
    # new implementations (attest-build-provenance v4 is its wrapper);
    # attestations are free for public repositories on all current
    # GitHub plans. artifact-metadata: write is the fine-grained
    # permission GA'd 2026-01-13 (creates the artifact storage record).
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          sha256sum SieveTray-windows.zip SieveTray-macos-arm64.zip SieveTray-macos-intel.zip > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/SieveTray-windows.zip
            artifacts/SieveTray-macos-arm64.zip
            artifacts/SieveTray-macos-intel.zip

      - name: Upload SHA256SUMS.txt as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS.txt
          path: artifacts/SHA256SUMS.txt

      - name: Attach SHA256SUMS.txt to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SHA256SUMS.txt
